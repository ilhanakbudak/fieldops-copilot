[project]
name = "fieldops-api"
version = "0.1.0"
description = "Retrieval, connectors and real-time call assistance for FieldOps Copilot."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.44",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "aiosqlite>=0.21",
    "argon2-cffi>=25.1",
    "pgvector>=0.4",
    "email-validator>=2.2",
    "pdfplumber>=0.11",
    "numpy>=2.1",
    "fastembed>=0.7",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Both are opt-in, for different reasons.
#
# PyMuPDF is markedly faster than the pdfplumber default, and is AGPL-3.0 — a
# licence this MIT repository will not take as a hard dependency. Install it
# deliberately, or hold a commercial licence, then set PDF_EXTRACTOR=pymupdf.
#
# PaddleOCR only matters for scanned pages, and pulls in a deep-learning runtime
# most deployments never need. See docs/RAG.md.
pymupdf = ["pymupdf>=1.26"]
ocr = ["paddleocr>=3.6", "paddlepaddle>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "mypy>=1.18",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Retrieval code is full of third-party clients without stubs; failing on those
# would mean silencing real errors alongside them.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
